<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Company Review</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17191c;background:#f6f7f8}
*{box-sizing:border-box}
body{margin:0;background:#f6f7f8}
header{background:#111827;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
header strong{font-size:16px}
nav{display:flex;gap:14px;flex-wrap:wrap}
nav button{background:none;border:0;color:#fff;padding:0;cursor:pointer;font:inherit;font-size:14px}
main{max-width:1080px;margin:28px auto 70px;padding:0 18px}
.card{background:#fff;border:1px solid #e4e7eb;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}h3{font-size:14px;margin:18px 0 8px}
p{line-height:1.5}.muted{color:#667085;font-size:14px}.number{font-size:14px;color:#667085;margin-bottom:6px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2ff;color:#3730a3}
.badge.pending{background:#fff7ed;color:#c2410c}.badge.escalated{background:#fff1f2;color:#be123c}.badge.applied{background:#ecfdf3;color:#027a48}
.kv{display:grid;grid-template-columns:160px 1fr;gap:7px 12px;font-size:14px}.kv div:nth-child(odd){color:#667085}
label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}
select,input,textarea{width:100%;padding:10px 11px;border:1px solid #cfd4dc;border-radius:8px;background:#fff;font:inherit}
textarea{min-height:92px;resize:vertical}
.radio{display:flex;gap:22px;margin:9px 0}.radio label{margin:0;font-weight:500;display:flex;gap:6px;align-items:center}.radio input{width:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.action{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}
button.primary{background:#111827;color:#fff}.secondary{background:#eef0f3;color:#20242a}.danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3!important}
a{color:#175cd3}.compact{margin:6px 0 0 20px;padding:0}.compact li{margin:5px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #eaecf0;padding:10px 8px;vertical-align:top}th{color:#475467;font-size:12px;text-transform:uppercase}
.notice{padding:11px 13px;background:#fffaeb;border:1px solid #fedf89;border-radius:8px;margin:12px 0}
.login{max-width:420px;margin:90px auto}.error{color:#b42318;font-size:14px}.hidden{display:none!important}
details{border-top:1px solid #eaecf0;margin-top:18px;padding-top:12px}summary{cursor:pointer;font-weight:650}
.loading{text-align:center;color:#667085;padding:70px 10px}
.copy{font-size:12px;margin-left:7px;border:1px solid #d0d5dd;background:#fff;border-radius:6px;padding:4px 7px;cursor:pointer}
</style>
</head>
<body>
<header id="header" class="hidden">
  <strong>Company Review</strong>
  <nav>
    <button onclick="goNext()">Next review</button>
    <button onclick="showList('pending')">Queue</button>
    <button onclick="showList('escalated')">Escalated</button>
    <button onclick="logout()">Log out</button>
  </nav>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<script>
const API="https://fuacnndegbdtbgksaoos.supabase.co/functions/v1/review-api";
const TOKEN_KEY="company_review_token";
const app=document.getElementById("app");
const header=document.getElementById("header");

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function pct(v){return v==null?"—":Math.round(Number(v)*100)+"%"}
function reviewNumberFromUrl(){return new URL(location.href).searchParams.get("review")}
function setReviewUrl(n){const u=new URL(location.href);u.searchParams.set("review",n);history.pushState({}, "", u)}
function clearReviewUrl(){const u=new URL(location.href);u.searchParams.delete("review");history.pushState({}, "", u)}

async function api(path,opts={}){
  const token=localStorage.getItem(TOKEN_KEY);
  const headers={"Content-Type":"application/json",...(opts.headers||{})};
  if(token)headers.Authorization="Bearer "+token;
  const res=await fetch(API+path,{...opts,headers});
  const data=await res.json().catch(()=>({}));
  if(res.status===401&&path!=="/login"){localStorage.removeItem(TOKEN_KEY);renderLogin("Session expired.");throw new Error("Unauthorized")}
  if(!res.ok)throw new Error(data.error||("Request failed: "+res.status));
  return data;
}

function renderLogin(error=""){
  header.classList.add("hidden");
  app.innerHTML=`<div class="card login"><h2>Company Review</h2><p>Enter the shared review password.</p>
  ${error?`<p class="error">${esc(error)}</p>`:""}
  <form id="loginForm"><label>Password</label><input id="password" type="password" required autofocus>
  <button class="action primary" style="width:100%;margin-top:14px">Sign in</button></form></div>`;
  document.getElementById("loginForm").onsubmit=async e=>{
    e.preventDefault();
    try{
      const d=await api("/login",{method:"POST",body:JSON.stringify({password:document.getElementById("password").value})});
      localStorage.setItem(TOKEN_KEY,d.token); header.classList.remove("hidden"); await route();
    }catch(err){renderLogin(err.message)}
  }
}

function logout(){localStorage.removeItem(TOKEN_KEY);renderLogin()}
async function goNext(){
  app.innerHTML='<div class="loading">Loading next review…</div>';
  try{
    const d=await api("/next");
    if(d.review_number==null){clearReviewUrl();app.innerHTML='<div class="card"><h1>Nothing pending 🎉</h1><p>There are no pending company reviews right now.</p><p><button class="action secondary" onclick="showList(\'escalated\')">View escalated reviews</button></p></div>';return}
    setReviewUrl(d.review_number);await renderReview(d.review_number)
  }catch(err){showError(err)}
}
function showError(err){app.innerHTML=`<div class="card"><h2>Something went wrong</h2><p class="error">${esc(err.message||err)}</p></div>`}

const CLASS_OPTIONS=[
["service_business","Service business"],["software_product","Software / product company"],["operating_company","Operating company"],["legal_services","Legal services"],["other","Other"],["unknown","Unknown"]
];
const CATEGORY_OPTIONS=[
["gtm_marketing","GTM — Marketing & Creative"],["gtm_sales","GTM — Sales"],["customer_service_bpo","Customer Service / BPO"],["recruiting_talent","Recruiting & Talent"],["finance_accounting","Finance & Accounting"],["it_managed_services","IT & Managed Services"],["hr_operations","HR Operations"],["research_insights","Research & Insights"],["innovation_programs","Innovation Programs"],["management_consulting","Management Consulting"],["professional_services_other","Other Professional Services"],["unknown","Unknown"]
];
function opts(arr,selected){return arr.map(([v,l])=>`<option value="${v}" ${selected===v?"selected":""}>${esc(l)}</option>`).join("")}

async function renderReview(n){
  app.innerHTML='<div class="loading">Loading review…</div>';
  try{
    const {review:r,company:c}=await api("/review/"+n);
    header.classList.remove("hidden");
    const website=r.corporate_website?`<a href="${esc(r.corporate_website)}" target="_blank" rel="noopener">${esc(r.corporate_website)}</a>`:"—";
    const jobs=(r.sample_job_titles||[]).map(x=>`<li>${esc(x)}</li>`).join("");
    const evidence=(r.evidence_urls||[]).map(x=>`<li><a href="${esc(x)}" target="_blank" rel="noopener">${esc(x)}</a></li>`).join("");
    const machineGtm=r.machine_is_gtm_agency===true?"Yes":r.machine_is_gtm_agency===false?"No":"Unclear";
    const defaultClass=r.human_company_class||r.machine_company_class||"service_business";
    const defaultCat=r.human_primary_service_category||r.machine_primary_service_category||"unknown";
    const defaultGtm=r.human_is_gtm_agency===true?"yes":r.human_is_gtm_agency===false?"no":r.machine_is_gtm_agency===true?"yes":"no";
    const shareUrl=new URL(location.href);shareUrl.searchParams.set("review",r.review_number);
    app.innerHTML=`
      <div class="number">Review #${r.review_number} · <span class="badge ${esc(r.status)}">${esc(r.status)}</span>
      <button class="copy" onclick="copyLink()">Copy link</button></div>
      <h1>${esc(r.company_name)}</h1>
      ${r.status==="escalated"?'<div class="notice"><strong>Escalated.</strong> This is waiting for Alex/partner review.</div>':""}
      <div class="grid">
        <div>
          <div class="card"><h2>Company context</h2><div class="kv">
            <div>Website</div><div>${website}</div>
            <div>Industry</div><div>${esc(c.industry||"—")}</div>
            <div>Jobs observed</div><div>${esc(r.observed_job_count??0)}</div>
          </div><h3>Description</h3><p>${esc(c.brief_description||"No description available.")}</p>
          <h3>Sample jobs</h3>${jobs?`<ul class="compact">${jobs}</ul>`:'<p class="muted">No sample job titles stored.</p>'}</div>

          <div class="card"><h2>Machine recommendation</h2><div class="kv">
            <div>Company class</div><div>${esc(r.machine_company_class||"unknown")}</div>
            <div>Service category</div><div>${esc(r.machine_primary_service_category||"—")}</div>
            <div>GTM agency?</div><div>${machineGtm}</div>
            <div>Delivery model</div><div>${esc(r.delivery_model||"unknown")}</div>
            <div>Confidence</div><div>${pct(r.machine_confidence)}</div>
          </div><h3>Reason</h3><p>${esc(r.machine_reason||"No machine reason available.")}</p>
          <h3>Evidence</h3>${evidence?`<ul class="compact">${evidence}</ul>`:'<p class="muted">No evidence URLs stored.</p>'}</div>
        </div>

        <div><div class="card"><h2>Human decision</h2>
          <form id="reviewForm">
            <label>What kind of company is this?</label>
            <select id="companyClass" required>${opts(CLASS_OPTIONS,defaultClass)}</select>
            <div id="serviceFields">
              <label>Primary service category</label>
              <select id="serviceCategory">${opts(CATEGORY_OPTIONS,defaultCat)}</select>
              <label>Is this a GTM agency?</label>
              <div class="radio">
                <label><input type="radio" name="gtm" value="yes" ${defaultGtm==="yes"?"checked":""}> Yes</label>
                <label><input type="radio" name="gtm" value="no" ${defaultGtm==="no"?"checked":""}> No</label>
              </div>
            </div>
            <label>Evidence URL <span class="muted">(optional)</span></label>
            <input id="evidenceUrl" type="url" value="${esc(r.human_evidence_url||"")}" placeholder="https://company.com/services">
            <label>Why? <span class="muted">(one sentence)</span></label>
            <textarea id="notes" required placeholder="Example: Provides outsourced bookkeeping and monthly accounting operations for clients.">${esc(r.human_notes||"")}</textarea>
            <div class="actions"><button class="action primary">Submit & Next</button></div>
          </form>
          ${r.status!=="applied"?'<div class="actions"><button class="action danger" onclick="escalate('+r.review_number+')">Escalate this review</button></div>':""}
          <details><summary>Quick classification guide</summary>
            <p><strong>Service business:</strong> B2B professional/outsourced services that perform a specialized function, deliver client-specific work, or manage operations for other companies.</p>
            <p><strong>GTM agency:</strong> service business executing marketing/creative/communications or outsourced sales/GTM work for clients.</p>
            <p><strong>Do not choose active/passive tracking.</strong> Tracking is derived automatically from service category configuration.</p>
            <p>If genuinely uncertain, use <strong>Escalate</strong> and send Review #${r.review_number} or this page URL to Alex/partner.</p>
          </details>
        </div></div>
      </div>`;

    const classSel=document.getElementById("companyClass"),fields=document.getElementById("serviceFields");
    const sync=()=>fields.classList.toggle("hidden",classSel.value!=="service_business");classSel.onchange=sync;sync();
    document.getElementById("reviewForm").onsubmit=async e=>{
      e.preventDefault();
      const gtm=document.querySelector('input[name="gtm"]:checked')?.value==="yes";
      try{
        const d=await api("/review/"+r.review_number+"/submit",{method:"POST",body:JSON.stringify({
          company_class:classSel.value,
          primary_service_category:document.getElementById("serviceCategory").value,
          is_gtm_agency:gtm,
          evidence_url:document.getElementById("evidenceUrl").value,
          notes:document.getElementById("notes").value
        })});
        if(d.next_review_number!=null){setReviewUrl(d.next_review_number);await renderReview(d.next_review_number)}
        else{clearReviewUrl();await goNext()}
      }catch(err){alert(err.message)}
    };
    window._shareUrl=shareUrl.toString();
  }catch(err){showError(err)}
}
async function escalate(n){
  const note=prompt("Optional note for Alex/partner:")||"";
  try{
    const d=await api("/review/"+n+"/escalate",{method:"POST",body:JSON.stringify({notes:note})});
    if(d.next_review_number!=null){setReviewUrl(d.next_review_number);await renderReview(d.next_review_number)}
    else{clearReviewUrl();await goNext()}
  }catch(err){alert(err.message)}
}
async function copyLink(){try{await navigator.clipboard.writeText(window._shareUrl||location.href);alert("Review link copied.")}catch{prompt("Copy this link:",window._shareUrl||location.href)}}
async function showList(status){
  clearReviewUrl();app.innerHTML='<div class="loading">Loading…</div>';
  try{
    const d=await api("/list?status="+encodeURIComponent(status));
    const rows=d.rows||[];
    app.innerHTML=`<div class="card"><h1>${status==="escalated"?"Escalated reviews":"Pending reviews"}</h1><p class="muted">${rows.length} shown</p>
    <table><thead><tr><th>#</th><th>Company</th><th>Machine class</th><th>Category</th><th>Confidence</th><th>Jobs</th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr><td><a href="?review=${r.review_number}" onclick="event.preventDefault();setReviewUrl(${r.review_number});renderReview(${r.review_number})">#${r.review_number}</a></td><td>${esc(r.company_name)}</td><td>${esc(r.machine_company_class||"—")}</td><td>${esc(r.machine_primary_service_category||"—")}</td><td>${pct(r.machine_confidence)}</td><td>${esc(r.observed_job_count??0)}</td></tr>`).join(""):'<tr><td colspan="6">Nothing here.</td></tr>'}</tbody></table></div>`;
  }catch(err){showError(err)}
}
async function route(){
  if(!localStorage.getItem(TOKEN_KEY)){renderLogin();return}
  header.classList.remove("hidden");
  const n=reviewNumberFromUrl();
  if(n)await renderReview(n);else await goNext();
}
window.onpopstate=route;
route();
</script>
</body>
</html>
